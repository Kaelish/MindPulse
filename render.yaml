services:
  - type: web
    name: mindpulse-backend
    runtime: python
    plan: free
    rootDir: mindpulse-backend
    buildCommand: pip install -r requirements.render.txt && python manage.py migrate
    startCommand: gunicorn mindpulse_api.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOW_ALL
        value: "False"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: ""
      - key: SUPABASE_URL
        value: https://whihfwcygbqpjtrpnlck.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
