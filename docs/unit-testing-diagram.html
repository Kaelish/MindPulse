<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }
  #figure {
    width: 760px;
    padding: 28px 0 18px;
    background: #ffffff;
  }
  svg {
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div id="figure">
<svg id="diagram" width="760" height="820" viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- System -->
  <rect x="230" y="20" width="300" height="88" rx="4" fill="#1f74bd" stroke="#155a94" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="73" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="1.5">MINDPULSE</text>

  <!-- Arrow: backend -> system -->
  <line x1="380" y1="190" x2="380" y2="112" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="160" y="190" width="440" height="132" rx="4" fill="#f6d5c6" stroke="#cf9d86" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#a93226" letter-spacing="1">BACKEND</text>
  <text x="380" y="257" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• API Endpoints</text>
  <text x="380" y="284" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• Video-Session &amp; Emotion Logic</text>
  <text x="380" y="311" text-anchor="middle" font-size="14" fill="#5b4b45">Django REST · APITestCase · unittest.mock</text>

  <!-- Arrow: web -> backend -->
  <line x1="380" y1="400" x2="380" y2="322" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Web -->
  <rect x="160" y="400" width="440" height="160" rx="4" fill="#fdf3c4" stroke="#d8c56f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#b7950b" letter-spacing="1">WEB FRONTEND</text>
  <text x="380" y="469" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• React Components (Admin)</text>
  <text x="380" y="496" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• React Components (Doctor)</text>
  <text x="380" y="523" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• Form Validation &amp; Service Modules</text>
  <text x="380" y="549" text-anchor="middle" font-size="14" fill="#5f5730">Jest · React Testing Library · jest-dom</text>

  <!-- Arrow: mobile -> web -->
  <line x1="380" y1="630" x2="380" y2="560" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Mobile -->
  <rect x="160" y="630" width="440" height="160" rx="4" fill="#d5e8d0" stroke="#8fbd82" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="665" text-anchor="middle" font-size="20" font-weight="700" fill="#2e7d32" letter-spacing="1">MOBILE FRONTEND</text>
  <text x="380" y="699" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• Patient &amp; Doctor Screens</text>
  <text x="380" y="726" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• Assessment, MindPlant &amp; Timer Logic</text>
  <text x="380" y="753" text-anchor="middle" font-size="17" font-weight="600" fill="#222222">• State &amp; Persistence (mocked storage)</text>
  <text x="380" y="779" text-anchor="middle" font-size="14" fill="#345b35">Jest · @react-native/jest-preset · AsyncStorage mock</text>
</svg>
</div>
</body>
</html>
